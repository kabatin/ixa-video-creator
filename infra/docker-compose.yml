services:
  postgres:
    image: postgres:16-alpine
    container_name: ixa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ixa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ixa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ixa}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ixa} -d ${POSTGRES_DB:-ixa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ixa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # NOTE: MinIO はコミュニティ版のビルド済みイメージの配布をやめた（2025-10）。
  # Docker Hub の minio/minio・minio/mc は削除され（2026-09-11）、quay.io も匿名の pull に
  # 401 を返すようになった（2026-09-30 に実機で確認）。そのため Chainguard が MinIO の
  # ソースからビルドして無償で公開しているイメージを使う。
  # - `latest-dev` を使うのは、シェルと mc が入っているため（下の healthcheck が
  #   `mc ready local`、minio-init が /bin/sh で mc を叩く）。`latest` はシェルも mc も無い。
  # - 無償で取れるのは latest 系のタグだけで、版は固定できない。
  #   再現性が必要になったら digest で固定するか、S3 互換の別実装への移行を検討すること。
  # Chainguard 版は nonroot（uid 65532）で動く。公式イメージ（root）で作った既存の
  # minio_data は root 所有のままで書き込めず、MinIO が起動できない。起動前に一度だけ
  # 所有者を揃える。既に 65532 所有なら何もしない（新規のボリュームも最初の 1 回だけ走る）。
  minio-volume-owner:
    image: cgr.dev/chainguard/minio:latest-dev
    container_name: ixa-minio-volume-owner
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - '[ "$$(stat -c %u /data)" = 65532 ] || chown -R 65532:65532 /data'
    volumes:
      - minio_data:/data

  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    container_name: ixa-minio
    restart: unless-stopped
    depends_on:
      minio-volume-owner:
        condition: service_completed_successfully
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-ixa_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-ixa_minio_dev_password}
    ports:
      # LAN 端末へ署名付きURLを返す場合だけ S3_BIND_HOST=0.0.0.0 にする。
      # 管理コンソールは常にローカル限定のままにする。
      - "${S3_BIND_HOST:-127.0.0.1}:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 一回限りのバケット作成ジョブ。正常終了するため restart は "no"。
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: ixa-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ixa_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-ixa_minio_dev_password}
      S3_BUCKET: ${S3_BUCKET:-ixa-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        (mc mb local/$$S3_BUCKET || true) &&
        mc anonymous set none local/$$S3_BUCKET

volumes:
  postgres_data:
  redis_data:
  minio_data:
