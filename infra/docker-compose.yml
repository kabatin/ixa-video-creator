services:
  postgres:
    image: postgres:16-alpine
    container_name: ixa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ixa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ixa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ixa}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ixa} -d ${POSTGRES_DB:-ixa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ixa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # NOTE: MinIO はリリースタグが日付ベースのため latest を使っている。
  # 初回起動後に `docker image inspect ixa-minio` でダイジェストを確認し、
  # 再現性が必要になった時点で具体的なタグへ固定すること。
  minio:
    image: minio/minio:latest
    container_name: ixa-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-ixa_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-ixa_minio_dev_password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 一回限りのバケット作成ジョブ。正常終了するため restart は "no"。
  minio-init:
    image: minio/mc:latest
    container_name: ixa-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ixa_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-ixa_minio_dev_password}
      S3_BUCKET: ${S3_BUCKET:-ixa-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        (mc mb local/$$S3_BUCKET || true) &&
        mc anonymous set none local/$$S3_BUCKET

volumes:
  postgres_data:
  redis_data:
  minio_data:
