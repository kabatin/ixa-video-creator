# 名前とポートは .env で替えられる（既定は今までと同じ ixa-postgres・5432 / ixa-redis・6379）。
# 同じ Mac で 2 つ目の clone を動かすときだけ使う（ADR-0063）。プロジェクト名は
# `pnpm ixa setup` が IXA_COMPOSE_PROJECT（既定 infra）で -p に渡す。
services:
  postgres:
    image: postgres:16-alpine
    container_name: ${IXA_COMPOSE_PREFIX:-ixa}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ixa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ixa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ixa}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ixa} -d ${POSTGRES_DB:-ixa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${IXA_COMPOSE_PREFIX:-ixa}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
# NOTE: 素材は MinIO をやめて手元のファイルに置くようにした（ADR-0041）。
# 以前の `minio_data` ボリュームは**わざとここに書いていない**。書いておくと
# `docker compose down -v` で消える。移行前のデータが入っているので、
# 要らないと分かるまで残す（消すときは `docker volume rm infra_minio_data`）。
