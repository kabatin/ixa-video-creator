name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 実 ffmpeg を使うテストが多数ある（media / render / providers/video / worker）。
      # ubuntu-latest には ffmpeg が入っておらず、入れないと spawn ENOENT で落ちる。
      # drawtext の有無で描画が縮退する経路があるため、対応状況をログに残す。
      # 日本語のフォントも入れる。無いとタイトルカードの文字が描かれず、画素の検査が落ちた（2026-10-17）。
      - name: Install ffmpeg and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters | grep -c drawtext || echo "drawtext なし（縮退経路で動く）"

      - name: Enable corepack
        run: corepack enable

      - name: Prepare pnpm via corepack
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
