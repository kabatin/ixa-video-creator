[project]
name = "ixa-audio"
version = "0.1.0"
description = "iXA 音楽解析サービス（librosa / ISC ライセンスのみを使用。ADR-0009）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "librosa>=0.11.0",
    "numpy>=2.0.0",
    "soundfile>=0.12.1",
    "pydantic>=2.9.0",
    # macOS x86_64 では llvmlite 0.46 以降のホイールが配布されておらず、
    # ソースビルド（要 LLVM）に落ちて失敗する。ホイールのある系列に固定する。
    # librosa の numba 依存は間接的なので、ここで上限を与えて解決を誘導する。
    "numba>=0.62,<0.63",
    "llvmlite>=0.45,<0.46",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
